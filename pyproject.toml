[project]
name = "v25-11-op"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
# uv pip install "torch==2.9.0" "torchvision==0.24.0" --index-url "https://download.pytorch.org/whl/cu128"
dependencies = [
    "cartopy>=0.25.0",
    "cfgrib>=0.9.15.1",
    "cftime>=1.6.5",
    "dask>=2025.10.0",
    "earth2studio[data,sfno]",
    "eccodes>=2.44.0",
    "einops>=0.8.1",
    "ffmpeg>=1.4",
    "geopandas>=1.1.1",
    "hydra-core>=1.3.2",
    "importlib-metadata>=8.7.0",
    "ipykernel>=7.1.0",
    "jupyter-http-over-ws>=0.0.8",
    "lightning>=2.5.6",
    "markitdown>=0.1.3",
    "matplotlib>=3.10.7",
    "metpy>=1.7.1",
    "mlflow>=3.6.0",
    "netcdf4>=1.7.3",
    "notebook>=7.4.7",
    "onnxruntime-gpu>=1.23.2",
    "opencv-python>=4.12.0.88",
    "pydantic>=2.12.4",
    "pygrib>=2.1.8",
    "pyyaml>=6.0.3",
    "radon>=6.0.1",
    "rasterio>=1.4.3",
    "requests>=2.32.5",
    "ruff>=0.14.5",
    "scipy>=1.16.3",
    "termcolor>=3.2.0",
    "wandb>=0.23.0",
    "xarray>=2025.10.1",
    "pandas>=2.2.2",
    "pip>=25.3",
]

[tool.uv.sources]
earth2studio = { git = "https://github.com/NVIDIA/earth2studio.git", rev = "0.9.0" }

[tool.ruff]
line-length = 80
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "D",   # pydocstyle (for Google Style docstrings)
    "UP",  # pyupgrade
    "ANN", # flake8-annotations
    "ASYNC", # flake8-async
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "ERA", # eradicate
    "ISC", # flake8-implicit-str-concat
    "ICN", # flake8-import-conventions
    "PIE", # flake8-pie
    "PL",  # Pylint
    "PT",  # flake8-pytest-style
    "PTH", # flake8-use-pathlib
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "TCH", # flake8-type-checking
    "RUF", # Ruff-specific rules
]
ignore = [
    "D100", # Missing docstring in public module
    "D104", # Missing docstring in public package
    "D105", # Missing docstring in magic method
    "D107", # Missing docstring in public __init__
    "D203", # 1 blank line required before class docstring (conflicts with D211)
    "D213", # Multi-line docstring summary should start on the second line (conflicts with D212)
    "D400", # First line should end with a period (handled by D401)
    "D401", # First line should be in imperative mood (ruff handles this better)
    "D406", # Section name should end with a colon (ruff handles this better)
    "D407", # Missing dashed underline after section (ruff handles this better)
    "D413", # Missing blank line after last section (ruff handles this better)
    "D416", # Section name should end with a colon (ruff handles this better)
    "ANN101", # Missing type annotation for self in method
    "ANN102", # Missing type annotation for cls in classmethod
    "PLR0913", # Too many arguments in function definition
    "PLR0911", # Too many return statements
    "PLR0912", # Too many branches
    "PLR0915", # Too many statements
]

[tool.ruff.lint.isort]
known-first-party = ["opflows"]

[tool.ruff.lint.pydocstyle]
convention = "google"


