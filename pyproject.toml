[project]
name = "dlamp"
version = "0.1.0"
description = "DLAMP Python ML package"
readme = "README.md"
authors = [
    { name = "yaochu", email = "yaochuwu.tw@gmail.com" }
]
requires-python = ">=3.11, <3.12"
dependencies = [
    "torch>=2.4.0",
    "lightning>=2.0.0",
    "hydra-core>=1.3.0",
    "pyyaml>=6.0",
    "numpy<2.0",
    "pydantic>=2.0",
    "torchvision>=0.28.0",
    "scipy>=1.17.1",
    "matplotlib>=3.11.1",
    "xarray>=2026.7.0",
    "dask>=2026.7.1",
    "h5netcdf>=1.8.1",
    "netcdf4>=1.7.3",
    "cfgrib>=0.9.15.1",
    "cftime>=1.6.5",
    "cdsapi>=0.7.7",
    "cdo>=1.6.1",
    "eccodeslib>=2.48.0.26",
    "eckitlib>=2.1.1.26",
    "onnx>=1.22.0",
    "openvino>=2026.3.0",
    "onnxruntime-gpu>=1.28.0",
    "onnxruntime-openvino>=1.24.1",
    "ipykernel>=7.3.0",
    "scikit-learn>=1.9.0",
    "wandb>=0.28.2",
    "importlib-metadata>=9.0.0",
    "requests>=2.34.2",
    "termcolor>=3.3.0",
    "mlflow>=3.15.1",
    "opencv-python>=4.11.0.86",
    "metpy>=1.7.1",
    "cartopy>=0.25.0",
    "geopandas>=1.1.4",
    "einops>=0.8.2",
    "rasterio>=1.4.4",
    "playwright>=1.62.0",
    "uxarray>=2026.6.0",
    "pygrib>=2.1.8",
    "opencc>=1.4.1",
]

[project.scripts]
dlamp-train = "dlamp.train:main"
dlamp-predict = "dlamp.analysis.prediction:main"
dlamp-export-onnx = "dlamp.export_onnx:main"
dlamp-infer-onnx = "dlamp.inference_onnx:main"
dlamp-gen-const-masks = "dlamp.generate_const_masks:main"
dlamp-unpack-tgz = "dlamp.unzip_tgz:main"

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "radon",
    "pytest",
    "pytest-cov",
    "pre-commit",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests requiring real sample ERA5 data in DLAMP_DATA_PATH (skipped by default)",
    "regression: tests comparing against pre-move golden baselines in DLAMP_DATA_PATH/regression_golden (run via `make regression`)",
]
addopts = "-m 'not integration and not regression'"
